#operator dist gather
dist_comm_gather:
    args:
        input:
            dtype: tensor
        gather_list:
            dtype: tuple[tensor]
            type_cast: list[tensor]
        rank_size:
            dtype: int
        dst:
            dtype: int
        rank_id:
            dtype: int
        group:
            dtype: str
        async_op:
            dtype: bool
            default: True
    returns:
        output:
            dtype: tensor
    function:
        disable: True
    dispatch:
        enable: True
        is_comm_op: True
        Ascend: DistCommGatherAscend
        CPU: DistCommGatherCPU
    non-differentiable: True
