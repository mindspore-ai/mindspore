#operator diagonal_view
diagonal_view:
  args:
    input:
      dtype: tensor
    offset:
      dtype: int
      default: 0
    dim1:
      dtype: int
      default: 0
    dim2:
      dtype: int
      default: 1
  returns:
    output:
      dtype: tensor
  function:
    disable: True
  view: True
  graph_view: True
  labels:
    side_effect_mem: True
  dispatch:
    enable: True
