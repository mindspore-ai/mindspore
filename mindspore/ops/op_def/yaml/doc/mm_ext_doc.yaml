mm_ext:
  description: |
    Return the matrix product of two arrays.
    If `input` is a :math:`(n \times m)` tensor, `mat2` is a
    :math:`(m \times p)` tensor, `out` will be a :math:`(n \times p)` tensor.

    Note:
        This function cannot support broadcasting.
        Refer to :func:`mindspore.mint.matmul` instead if you need a broadcastable function.
        The last dimension of `input` must be the same size as the first dimension of `mat2`.

    .. warning::
        This is an experimental API that is subject to change or deletion.

    Args:
        input (Tensor): The first matrix tensor.
        mat2 (Tensor): The second matrix tensor.

    Returns:
        Tensor

    Supported Platforms:
        ``Ascend``

    Examples:
        >>> import mindspore
        >>> x1 = mindspore.mint.rand(2, 3)
        >>> x2 = mindspore.mint.rand(3, 4)
        >>> mindspore.mint.mm(x1, x2).shape
        (2, 4)
