narrow:
    description: |
        Obtains a tensor of a specified length at a specified start position along a specified axis.

        .. warning::
            After version 2.9.0, the parameter `axis` will be renamed to `dim`.

        Args:
            input (Tensor): the tensor to narrow.
            dim (int): the axis along which to narrow.
            start (Union[int, Tensor[int]]): the starting dimension.
            length (int): the distance to the ending dimension.

        Returns:
            Tensor

        Raises:
            ValueError: If the rank of `input` is 0.
            ValueError: If the value of `dim` is out of the range [-input.ndim, input.ndim).
            ValueError: If the value of `start` is out of the range [-input.shape[dim], input.shape[dim]].
            ValueError: If the value of `length` is out of the range [0, input.shape[dim]-start].

        Supported Platforms:
            ``Ascend`` ``GPU`` ``CPU``

        Examples:
            >>> import mindspore
            >>> from mindspore import ops
            >>> from mindspore import Tensor
            >>> x = Tensor([[1, 2, 3], [4, 5, 6], [7, 8, 9]], mindspore.int32)
            >>> output = ops.auto_generate.narrow(x, 0, 0, 2)
            >>> print(output)
            [[ 1 2 3]
             [ 4 5 6]]
            >>> output = ops.auto_generate.narrow(x, 1, 1, 2)
            >>> print(output)
            [[ 2 3]
             [ 5 6]
             [ 8 9]]
