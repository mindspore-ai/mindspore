# primitive and functional interfaces are internal interfaces and users use it by ops.extend.max
max:
  description: |
    Calculates the maximum value of the input tensor.

    Also see :func:`mindspore.ops.extend.max`.

    .. warning::
        After version 2.9.0, when `axis` is ``None``, the return value will change from a tuple
        to a single Tensor, and `initial`/`where` will no longer be supported.

