flatten_ext:
    description: |
        Flatten a tensor along dimensions from `start_dim` to `end_dim`.

        Args:
            input (Tensor): The input tensor.
            start_dim (int, optional): The first dimension to flatten. Default ``0`` .
            end_dim (int, optional): The last dimension to flatten. Default ``-1`` .

        Returns:
            Tensor. If no dimensions are flattened, return the original `input`, otherwise return the flattened tensor.
            If `input` is a 0-D tensor, a 1-D tensor will be returned.

        Raises:
            ValueError: If `start_dim` is greater than `end_dim` after canonicalized.
            ValueError: If `start_dim` or `end_dim` is not in range of [-input.dim, input.dim-1].

        Supported Platforms:
            ``Ascend`` ``GPU`` ``CPU``

        Examples:
            >>> import mindspore
            >>> input_x = mindspore.mint.ones([1, 2, 3, 4])
            >>> input_x.shape
            (1, 2, 3, 4)
            >>> mindspore.mint.flatten(input_x).shape
            (24,)
            >>> mindspore.mint.flatten(input_x, start_dim=1, end_dim=2).shape
            (1, 6, 4)