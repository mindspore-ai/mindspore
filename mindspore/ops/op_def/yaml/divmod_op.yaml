#operator divmod
divmod:
    args:
        input:
            dtype: tensor
            type_cast: number
        other:
            dtype: tensor
            type_cast: number
        rounding_mode:
            dtype: int
            default: None
            arg_handler: str_to_enum
    returns:
        output:
            dtype: tensor
    class:
        name: DivMod
    function:
        disable: True
    dispatch:
        enable: True
        Ascend: DivModAscend
        GPU: DivModGPU
        CPU: DivModCPU
