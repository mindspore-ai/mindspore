max:
  description: |
    max(input) -> Tensor

    Return the maximum value of the input tensor.

    Args:
        input (Tensor): The input tensor.

    Returns:
        Tensor

    Supported Platforms:
        ``Ascend`` ``GPU`` ``CPU``

    Examples:
        >>> import mindspore
        >>> x = mindspore.tensor([0.0, 0.4, 0.6, 0.7, 0.1], mindspore.float32)
        >>> mindspore.mint.max(x)
        Tensor(shape=[], dtype=Float32, value= 0.7)

    .. function:: max(input, dim, keepdim=False) -> tuple(Tensor)
        :noindex:

    Return the maximum value of the input tensor along the specified dimension.

    Args:
        input (Tensor): The input tensor.
        dim (int): Specify the dimension to compute.
        keepdim (bool, optional): Whether the output tensor has dim retained. Default ``False``.

    Returns:
        Tuple of two tensors, tuple(max, max_indices).

    Supported Platforms:
        ``Ascend`` ``GPU`` ``CPU``

    Examples:
        >>> import mindspore
        >>> x = mindspore.tensor([0.0, 0.4, 0.6, 0.7, 0.1], mindspore.float32)
        >>> mindspore.mint.max(x, 0, keepdim=True)
        (Tensor(shape=[1], dtype=Float32, value= [ 6.99999988e-01]), Tensor(shape=[1], dtype=Int64, value= [3]))

    .. function:: max(input, other) -> Tensor
        :noindex:

    For details, please refer to :func:`mindspore.mint.maximum`.
